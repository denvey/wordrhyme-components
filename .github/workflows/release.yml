name: Release Package

on:
  push:
    branches:
      - main
      - next
  workflow_dispatch:

jobs:
  audit-publishers:
    name: Audit npm publisher authentication
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Check registry token exchange for all public packages
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set('audience', 'npm:registry.npmjs.org');
          const identityResponse = await fetch(tokenUrl, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          });
          if (!identityResponse.ok) throw new Error(`GitHub identity request failed: ${identityResponse.status}`);
          const { value: identity } = await identityResponse.json();
          if (!identity) throw new Error('GitHub identity token is missing');
          let failures = 0;
          for (const entry of await readdir('packages', { withFileTypes: true })) {
            if (!entry.isDirectory()) continue;
            const pkg = JSON.parse(await readFile(`packages/${entry.name}/package.json`, 'utf8'));
            if (pkg.private) continue;
            const response = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${pkg.name.replace('/', '%2f')}`, {
              method: 'POST', headers: { Authorization: `Bearer ${identity}` },
            });
            if (response.ok) {
              const body = await response.json();
              if (!body.token) throw new Error(`Registry token missing for ${pkg.name}`);
              console.log(`${pkg.name}: ACCEPTED`);
            } else {
              failures++;
              console.log(`${pkg.name}: REJECTED (${response.status}) ${await response.text()}`);
            }
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          if (failures) throw new Error(`${failures} npm publisher configurations rejected`);
          NODE

  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Create Release and Publish
    runs-on: ubuntu-latest
    needs: [ci, audit-publishers]
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Generate bot app token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASER_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm-global" npm@11.6.2
          echo "$RUNNER_TEMP/npm-global/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-global/bin/npm" --version

      - name: Build release packages
        run: pnpm build

      - name: Release
        # Recover already-versioned releases below when no changesets remain.
        continue-on-error: true
        uses: pixpilot/changesets-autopilot@v1
        env:
          # The dependency closure is already built; avoid destructive parallel hooks.
          npm_config_ignore_scripts: 'true'
        with:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          # No NPM_TOKEN: npm Trusted Publishing authenticates this job via OIDC.
          provenance: true
          # Release only the explicit .changeset entries committed with a change.
          AUTO_CHANGESET: false

      - name: Ensure all workspace releases are published with OIDC
        env:
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
          NPM_CONFIG_PROVENANCE: 'true'
          npm_config_ignore_scripts: 'true'
        run: |
          PACKAGE_DIRS=$(pnpm -r --workspace-concurrency=1 --sort exec node -e 'const p=require("./package.json"); if(!p.private) console.log(process.cwd())')
          while IFS= read -r PACKAGE_DIR; do
            PACKAGE_NAME=$(node -p 'require(process.argv[1]).name' "$PACKAGE_DIR/package.json")
            PACKAGE_VERSION=$(node -p 'require(process.argv[1]).version' "$PACKAGE_DIR/package.json")
            if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org; then
              continue
            fi
            # pnpm rewrites workspace dependencies; npm 11 provides OIDC publishing.
            pnpm --filter "$PACKAGE_NAME" pack --pack-destination "$RUNNER_TEMP"
            TARBALL_NAME="${PACKAGE_NAME#@}"
            "$RUNNER_TEMP/npm-global/bin/npm" publish "$RUNNER_TEMP/${TARBALL_NAME//\//-}-$PACKAGE_VERSION.tgz" \
              --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org
            # Wait for registry visibility before publishing dependent packages.
            for attempt in $(seq 1 20); do
              if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org; then
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                echo "$PACKAGE_NAME@$PACKAGE_VERSION is not visible in the registry"
                exit 1
              fi
              sleep 30
            done
          done <<< "$PACKAGE_DIRS"

      - name: Verify published AutoCrud dependency closure
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/auto-crud/package.json').version")
          VERIFY_DIR=$(mktemp -d)
          cd "$VERIFY_DIR"
          npm init --yes
          # npm may acknowledge publication before the version is installable.
          for attempt in $(seq 1 20); do
            if npm install "@wordrhyme/auto-crud@$PACKAGE_VERSION" \
              --package-lock-only --ignore-scripts --legacy-peer-deps --prefer-online \
              --registry=https://registry.npmjs.org; then
              exit 0
            fi
            if [ "$attempt" -lt 20 ]; then
              sleep 30
            fi
          done
          echo "Published AutoCrud dependencies could not be resolved"
          exit 1
